[workspace]
members = ["crates/gitr", "crates/gitr-cli", "crates/gitr-mcp", "crates/gitr-tower"]
exclude = ["crates/gitr/fuzz"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/ekhodzitsky/gitr"
authors = ["Evgeny Khodzitsky"]

[workspace.dependencies]
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "process", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
criterion = "0.5"
gitr = { path = "crates/gitr" }
