[package]
name = "gitr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Async typed git CLI wrapper for agents and automation."
keywords = ["git", "async", "cli", "agent", "worktree"]
categories = ["development-tools", "asynchronous"]
readme = "../../README.md"
exclude = [".git", "target"]

[features]
default = []
tracing = ["dep:tracing"]
serde = ["dep:serde"]
stream = ["dep:tokio-stream"]
metrics = ["dep:metrics"]
test-utils = []

[dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true, optional = true }

tracing = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
async-trait = "0.1"
metrics = { version = "0.24", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tempfile = "~3.14"
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "~1.5"
half = "<2.7"
insta = { version = "1.40", features = ["yaml", "json"] }

[[bench]]
name = "ops"
harness = false

[[bench]]
name = "gitr_bench"
harness = false
